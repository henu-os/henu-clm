<script>
    // Smooth micro-increment on the splash screen percentage counter
    document.addEventListener('DOMContentLoaded', () => {
      const counter = document.getElementById('percentCounter');
      let currentVal = 12;
      const interval = setInterval(() => {
        if (currentVal < 92) {
          currentVal += Math.floor(Math.random() * 4) + 1;
          if (currentVal > 92) currentVal = 92;
          if (counter) counter.innerText = `${currentVal}%`;
        } else {
          clearInterval(interval);
        }
      }, 120);
    });
